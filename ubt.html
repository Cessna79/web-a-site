
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#14181C" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>UBT Run Sheet</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  :root{
    --bg:#14181C; --panel:#1C232B; --panel2:#252E38; --line:#33404C;
    --hi:#EAF0F4; --mid:#93A2AE; --dim:#5E6E7A;
    --amber:#F5A623; --go:#3DBE6B; --stop:#E5484D; --blue:#3B9BE0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--hi);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:480px;margin:0 auto;min-height:100%}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
    padding:calc(38px + env(safe-area-inset-top, 0px)) 16px 12px;display:flex;align-items:center;gap:12px}
  .brand{font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
  .title{font-size:17px;font-weight:600}
  main{padding:16px}
  .save-status{
  font-size:11px;
  color:var(--go);
  white-space:nowrap;
  opacity:.9;
}

.save-status.saving{
  color:var(--amber);
}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .lbl{font-size:12px;color:var(--mid);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
  input,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    color:var(--hi);padding:13px 12px;font-size:16px;outline:none;font-family:inherit}
  textarea{min-height:72px;resize:vertical}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .field{margin-bottom:14px}
  .btn{width:100%;border:none;border-radius:12px;padding:16px;font-size:17px;font-weight:700;
    cursor:pointer;color:#0e0e10}
  .start-shift-btn{height:72px;padding:0 20px;font-size:21px;font-weight:700;border-radius:18px;}
  .btn:disabled{opacity:.45}
  .btn.go{background:var(--go)} .btn.amber{background:var(--amber)}
  .btn.blue{background:var(--blue)} .btn.dark{background:var(--panel2);color:var(--hi)}
  .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row .k{color:var(--mid)} .row .v{font-weight:600}
  .seg{flex:1;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--hi);
    padding:14px 8px;font-size:14px;cursor:pointer;text-align:center}
  .seg.on{color:#0e0e10;font-weight:700}
  .segs{display:flex;gap:8px}
  .stamp{flex:1;border:1px solid var(--line);border-radius:10px;background:var(--panel2);
    padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center}
  .stamp small{font-size:12px;color:var(--mid);text-transform:uppercase;letter-spacing:1px}
  .stamp b{font-size:20px;font-family:ui-monospace,Menlo,monospace}
  .stoprow{width:100%;display:flex;align-items:center;gap:12px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer;
    color:var(--hi);text-align:left}
  .stoprow .sub{font-size:12px;color:var(--mid);margin-top:3px}
  .stat{flex:1}
  .stat .n{font-size:22px;font-weight:700;margin-top:4px}
  .pill{border:1px solid var(--line);background:var(--panel2);color:var(--hi);border-radius:20px;
    padding:7px 14px;font-size:13px;cursor:pointer}
  .icon{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
    color:var(--hi);font-size:22px;line-height:1;cursor:pointer}
  .muted{color:var(--mid);font-size:14px;line-height:1.6}
  .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:8;display:flex;max-width:480px;margin:0 auto;
    background:var(--panel);border-top:1px solid var(--line);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
  .tab{flex:1;background:none;border:none;color:var(--mid);cursor:pointer;display:flex;flex-direction:column;
    align-items:center;gap:2px;padding:4px 0;font-size:11px;letter-spacing:.3px;border-radius:8px}
  .tab.active{color:var(--amber)}
  body.has-tabs main{padding-bottom:68px}
  .badge{font-size:10px;letter-spacing:1px;color:#0e0e10;border-radius:4px;padding:1px 5px;margin-right:6px;font-weight:700}
  .btn.stopb{background:var(--stop);color:#0e0e10}
  .note{color:var(--dim);font-size:12px;line-height:1.6;margin-top:18px}
  .mt{margin-top:32px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);
    border:1px solid var(--line);color:var(--hi);padding:12px 18px;border-radius:24px;font-size:14px;
    z-index:20;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div id="navL"></div>
    <div style="flex:1;text-align:center">
  <div class="brand" style="font-size:16px;font-weight:800;letter-spacing:1.6px">
  United Brothers 
</div>
  <div class="title" id="scr">Loading…</div>
</div>
    <div id="navR">   <span id="saveStatus" class="save-status">✓ Saved</span> </div>
  </header>
  <main id="app"></main>
</div>
<nav id="tabbar" class="tabbar" style="display:none">

  <button class="tab" data-act="tab" data-tab="shift">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 3h13v13H1z"/>
      <path d="M14 8h4l3 3v5h-7z"/>
      <circle cx="5.5" cy="18.5" r="1.8"/>
      <circle cx="17.5" cy="18.5" r="1.8"/>
    </svg>
    <span>Shift</span>
  </button>

  <button class="tab" data-act="tab" data-tab="summary">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="3" width="16" height="18" rx="2"/>
      <path d="M8 7h8"/>
      <path d="M8 11h8"/>
      <path d="M8 15h5"/>
    </svg>
    <span>Summary</span>
  </button>

  <button class="tab" data-act="tab" data-tab="week">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="17" rx="2"/>
      <path d="M3 9h18M8 2v4M16 2v4"/>
    </svg>
    <span>Week</span>
  </button>

  <button class="tab" data-act="tab" data-tab="sheets">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
      <path d="M14 3v6h6M8 13h8M8 17h6"/>
    </svg>
    <span>Sheets</span>
  </button>

   <button class="tab" data-act="tab" data-tab="profile">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>
    </svg>
    <span>Profile</span>
  </button> 
</nav>
<div id="toast" class="toast"></div>

<script>
"use strict";

/* =========================================================
   PDF LIBRARY
========================================================= */
const PDFLib = window.PDFLib;


/* =========================================================
   STORAGE
========================================================= */
const store = (() => {
  let mem = {};
  let ok = true;

  try {
    localStorage.setItem("__ubt_test", "1");
    localStorage.removeItem("__ubt_test");
  } catch(e) {
    ok = false;
  }

  return {
    get(k) {
      try {
        return ok ? localStorage.getItem(k) : mem[k];
      } catch(e) {
        return mem[k];
      }
    },

    set(k, v) {
      try {
        ok ? localStorage.setItem(k, v) : (mem[k] = v);
      } catch(e) {
        mem[k] = v;
      }
    }
  };
})();


/* =========================================================
   BASIC HELPERS
========================================================= */
const pad = n => String(n).padStart(2, "0");

function round15(ms) {
  if(ms == null) return null;

  const d = new Date(ms);
  d.setSeconds(0, 0);

  const minutes = d.getMinutes();
  const rounded = Math.round(minutes / 15) * 15;

  if(rounded === 60) {
    d.setHours(d.getHours() + 1);
    d.setMinutes(0);
  } else {
    d.setMinutes(rounded);
  }

  return d.getTime();
}


/* Exact clock time for customer arrival/departure */
const fmtT = ms => {
  if(ms == null) return "";

  const d = new Date(ms);

  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
};


const WD = [
  "Sunday",
  "Monday",
  "Tuesday",
  "Wednesday",
  "Thursday",
  "Friday",
  "Saturday"
];


function todayStr(d = new Date()) {
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}


function diffH(s, f) {
  if(s == null || f == null) return 0;

  let ms = f - s;

  if(ms < 0) ms += 864e5;

  return ms / 36e5;
}


const hDec = h =>
  h ? (Math.round(h * 100) / 100).toFixed(2) : "";


const hHM = h => {
  if(!h) return "00:00";

  const t = Math.round(h * 60);

  return `${pad(Math.floor(t / 60))}:${pad(t % 60)}`;
};


function mondayOf(d) {
  const x = new Date(d);
  const w = (x.getDay() + 6) % 7;

  x.setDate(x.getDate() - w);
  x.setHours(0, 0, 0, 0);

  return x;
}


function parseDate(s) {
  const p = String(s).split("-").map(Number);

  return new Date(
    p[0],
    (p[1] || 1) - 1,
    p[2] || 1
  );
}


/* HTML escape */
const esc = s =>
  (s == null ? "" : String(s)).replace(
    /[&<>"]/g,
    c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;"
    }[c])
  );


/* =========================================================
   TEMPERATURE HELPERS
========================================================= */
function tempUnit() {
  return S.profile?.tempUnit === "F" ? "F" : "C";
}


function tempLabel() {
  return tempUnit() === "F"
    ? "Temperature (°F)"
    : "Temperature (°C)";
}


function tempSuffix() {
  return tempUnit() === "F" ? "°F" : "°C";
}


/*
   We store the value exactly as the driver enters it.

   Examples:
   -10
   -5.5
   2
   35
*/
function cleanTemp(value) {
  return String(value ?? "")
    .replace(/[^\d.-]/g, "")
    .replace(/(?!^)-/g, "")
    .replace(/^(-?\d*\.\d*).*$/, "$1");
}


/* =========================================================
   STATE
========================================================= */
let S;


function blankNext() {
  return {
    company: "",
    city: "",
    trailer: "",
    bobtail: false,
    status: null,
    fuel: "",
    temp: "",
    timeIn: null,
    timeOut: null,
    remarks: ""
  };
}


function loadState() {
  try {
    const raw = store.get("ubt");

    if(raw) {
      const o = JSON.parse(raw);

      const shift = o.shift || null;

      if(shift && shift.phase == null) {
        shift.phase = "atStop";
      }

      if(shift && !shift.done && !shift.next) {
        shift.next = blankNext();
      }

      /*
         Backward compatibility:
         profiles created before temperature-unit support
         automatically use Celsius.
      */
      if(o.profile && !o.profile.tempUnit) {
        o.profile.tempUnit = "C";
      }

      const view =
        !o.profile
          ? "setup"
          : (shift && !shift.done ? "shift" : "home");

      return {
        profile: o.profile || null,
        past: o.past || [],
        shift,
        view,
        editMode: "edit",
        editIdx: null,
        draft: null
      };
    }
  } catch(e) {
    console.error("State load error:", e);
  }

  return {
    profile: null,
    past: [],
    shift: null,
    view: "setup",
    editMode: "edit",
    editIdx: null,
    draft: null
  };
}


function persist() {
  const status = document.getElementById("saveStatus");

  if(status) {
    status.textContent = "Saving…";
    status.classList.add("saving");
  }

  store.set(
    "ubt",
    JSON.stringify({
      profile: S.profile,
      past: S.past,
      shift: S.shift
    })
  );

  if(status) {
    status.textContent = "✓ Saved";
    status.classList.remove("saving");
  }
}


function upsertPast(sh) {
  const c = JSON.parse(JSON.stringify(sh));

  const i = S.past.findIndex(x => x.id === sh.id);

  if(i >= 0) {
    S.past[i] = c;
  } else {
    S.past.push(c);
  }
}


S = loadState();


/* =========================================================
   TOAST
========================================================= */
let toastTimer;

function toast(msg) {
  const t = document.getElementById("toast");

  if(!t) return;

  t.textContent = msg;
  t.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(
    () => t.classList.remove("show"),
    2200
  );
}


/* =========================================================
   NAVIGATION
========================================================= */
function go(view) {
  S.view = view;
  persist();
  render();
}


const FUEL = [
  "Empty",
  "Qtr",
  "Half",
  "Full"
];


/* =========================================================
   DOM
========================================================= */
const app = document.getElementById("app");


/* =========================================================
   RENDER
========================================================= */
function render() {

  const scr = document.getElementById("scr");
  const navL = document.getElementById("navL");
  const navR = document.getElementById("navR");

  if(!scr || !navL || !navR || !app) {
    console.error("Required application elements are missing.");
    return;
  }

  navL.innerHTML = "";
  navR.innerHTML =
    '<span id="saveStatus" class="save-status">✓ Saved</span>';

  const editTitle =
    S.editMode === "next"
      ? "Next stop"
      : (
          S.draft && S.draft.pinned === "start"
            ? "Starting point"
            : (
                S.draft && S.draft.pinned === "end"
                  ? "End yard"
                  : "Edit stop"
              )
        );

  const titles={
setup:"Set up profile",
home:"Shift",
shift:"On duty",
summary:"Summary",
editStop:editTitle,
final:"End of shift",
changeTruck:"Change truck",
sheet:"Daily run sheet",
week:"Weekly timesheet",
sheets:"Saved sheets",
profile:"Profile",
};

  scr.textContent = titles[S.view] || "";

  if(S.view === "summary" && S.shift && S.shift.done){
    scr.textContent = "Shift complete";
  }

 const topLevel=["home","shift","summary","week","sheets","profile"];

  if(["editStop", "final", "changeTruck", "sheet"].includes(S.view)) {

    const back = {
  editStop: "shift",
  final: "shift",
  changeTruck: "shift",
  sheet: "summary"
  }[S.view];

    navL.innerHTML =
      `<button class="icon"
        data-act="go"
        data-v="${back}"
        aria-label="Back">‹</button>`;

  } else {

    navL.innerHTML =
      `<div style="
        width:8px;
        height:8px;
        border-radius:8px;
        background:var(--amber)">
      </div>`;
  }


  const renderer = {
  setup: vSetup,
  home: vHome,
  shift: vShift,
  summary: vSummary,
  editStop: vEditStop,
  final: vFinal,
  changeTruck: vChangeTruck,
  sheet: vSheet,
  week: vWeek,
  sheets: vSheets,
  profile: vProfile
}[S.view];


  try {
    app.innerHTML = renderer ? renderer() : "";
  } catch(e) {
    console.error("Render error:", e);

    app.innerHTML = `
      <div class="card">
        <div class="lbl">Application error</div>
        <div class="muted">
          Something went wrong while loading this screen.
        </div>
      </div>
    `;
  }


  const tb = document.getElementById("tabbar");

  if(!tb) return;

  const showTabs = topLevel.includes(S.view);

  document.body.classList.toggle(
    "has-tabs",
    showTabs
  );

  tb.style.display = showTabs ? "flex" : "none";

  if(showTabs) {

    tb.querySelector('[data-tab="shift"]')
      ?.classList.toggle(
        "active",
        S.view === "shift" ||
        S.view === "home"
      );

    tb.querySelector('[data-tab="summary"]')
      ?.classList.toggle(
        "active",
        S.view === "summary"
      );

    tb.querySelector('[data-tab="week"]')
      ?.classList.toggle(
        "active",
        S.view === "week"
      );

    tb.querySelector('[data-tab="sheets"]')
      ?.classList.toggle(
        "active",
        S.view === "sheets"
      );
    tb.querySelector('[data-tab="profile"]').classList.toggle("active", S.view==="profile");
  }
}


/* =========================================================
   SETUP / PROFILE
========================================================= */
function vSetup() {

  const unit =
    S.profile?.tempUnit === "F"
      ? "F"
      : "C";

  return `
    <p class="muted" style="margin-top:0">
      Enter this once. Your name and corporation print on every sheet.
      Your home base is the yard you usually start from — you can change
      it for any day at start. The truck changes daily, so you enter that
      when you start a shift.
    </p>

    <div class="field">
      <div class="lbl">Driver name</div>
      <input
        id="pn"
        placeholder="e.g. M. Singh"
        value="${esc(S.profile?.name || "")}">
    </div>

    <div class="field">
      <div class="lbl">Corporation</div>
      <input
        id="pc"
        placeholder="e.g. 12345 Ontario Inc."
        value="${esc(S.profile?.corp || "")}">
    </div>

    <div class="field">
      <div class="lbl">Home base (usual start yard)</div>
      <input
        id="ph"
        placeholder="e.g. UBT Yard, Brampton"
        value="${esc(S.profile?.homeBase || "")}">
    </div>

    <div class="field">
      <div class="lbl">Temperature unit</div>

      <div class="segs">

        <div
          class="seg ${unit === "C" ? "on" : ""}"
          style="${unit === "C" ? "background:var(--go)" : ""}"
          data-act="tempUnit"
          data-unit="C">
          °C
        </div>

        <div
          class="seg ${unit === "F" ? "on" : ""}"
          style="${unit === "F" ? "background:var(--go)" : ""}"
          data-act="tempUnit"
          data-unit="F">
          °F
        </div>

      </div>
    </div>

    <button class="btn go" data-act="saveProfile">
      Save profile
    </button>
  `;
}

function vProfile(){
  const p=S.profile||{};
  const u=p.tempUnit||"C";

  return `
    <div class="card">

      <div class="field">
        <div class="lbl">Driver name</div>
        <input id="pn" value="${esc(p.name||"")}">
      </div>

      <div class="field">
        <div class="lbl">Corporation</div>
        <input id="pc" value="${esc(p.corp||"")}">
      </div>

      <div class="field">
        <div class="lbl">Home base</div>
        <input id="ph" value="${esc(p.homeBase||"")}">
      </div>

      <div class="field">
        <div class="lbl">Temperature unit</div>
        <div class="segs">
          <div class="seg ${u==="C"?"on":""}"
            style="${u==="C"?"background:var(--go)":""}"
            data-act="tempUnit" data-unit="C">
            °C Celsius
          </div>

          <div class="seg ${u==="F"?"on":""}"
            style="${u==="F"?"background:var(--go)":""}"
            data-act="tempUnit" data-unit="F">
            °F Fahrenheit
          </div>
        </div>
      </div>

      <button class="btn go" data-act="saveProfile">
        Save profile
      </button>

    </div>

    <button class="btn dark mt" data-act="masterReset"
      style="color:var(--stop);border:1px solid var(--stop)">
     Reset All Data
    </button>
  `;
}

/* =========================================================
   HOME
========================================================= */
function vHome() {

  const now = new Date();

  return `
    <div class="card" style="text-align:center;margin-top:150px">

      <div class="lbl">Today</div>

      <div style="font-size:20px;font-weight:600;margin-top:4px">
        ${WD[now.getDay()]}, ${todayStr(now)}
      </div>

      <div id="nowClock" class="mono"
        style="font-size:34px;font-weight:700;color:var(--amber);margin-top:6px">
        ${fmtT(now.getTime())}
      </div>

    </div>

    <button
      class="btn go mt"
      data-act="startShiftHome">
      Start shift
    </button>
  `;
}


/* =========================================================
   START SHIFT SCREEN
========================================================= */
function startShiftForm() {

  return `
    <div class="card">

      <div class="field">
        <div class="lbl">Truck #</div>
        <input
           id="truck"
           type="text"
           inputmode="numeric"
           pattern="[0-9]*"
           placeholder="e.g. 123"
           autocomplete="off"
           required>
      </div>

      <div class="field">
        <div class="lbl">Starting mileage</div>
        <input
          id="startKm"
          type="text"
          inputmode="decimal"
          placeholder="e.g. 245678"
          required>
      </div>

      <div class="field">
        <div class="lbl">Starting yard / company</div>
        <input
          id="startCo"
          placeholder="${esc(S.profile?.homeBase || "Yard")}"
          required>
      </div>

      <div class="field">

/* =========================================================
   STOP ROW
========================================================= */
function stopRowHtml(s, i) {

  const locked = !!(S.shift && S.shift.done);

  const badge = s.pinned
    ? `<span
        class="badge"
        style="background:${
          s.pinned === "start"
            ? "var(--go)"
            : "var(--stop)"
        }">
        ${
          s.pinned === "start"
            ? "START"
            : "END"
        }
      </span>`
    : "";

  const openTag = locked
    ? `<div class="stoprow" style="cursor:default">`
    : `<button class="stoprow" data-act="editStop" data-i="${i}">`;

  return `
    ${openTag}
      <div style="flex:1">

        <div style="font-weight:600">
          ${badge}
          ${esc(s.company) || "—"}
          ${
            s.city
              ? ` · <span style="
                    color:var(--mid);
                    font-weight:400">
                    ${esc(s.city)}
                  </span>`
              : ""
          }
        </div>

        <div class="sub">
          ${
            s.bobtail
              ? "BOBTAIL"
              : (esc(s.trailer) || "no trailer")
          }
          ·
          ${
            s.status === "load"
              ? "LOADED"
              : s.status === "empty"
                ? "EMPTY"
                : "—"
          }
          ${
            s.status === "load"
              ? (s.dry ? " · Dry" : (s.temp ? ` · ${esc(s.temp)}${tempSuffix()}` : ""))
              : ""
          }
        </div>

      </div>

      <div
        class="mono"
        style="
          font-size:12px;
          text-align:right;
          white-space:nowrap">

        ${fmtT(s.timeIn) || "--:--"}

        <br>

        ${fmtT(s.timeOut) || "--:--"}

      </div>

    ${locked ? "</div>" : "</button>"}
  `;
}


/* =========================================================
   STOP FIELDS
========================================================= */
function reeferToggleHtml(d){
  return `
    <div class="field">
      <div class="lbl">Reefer</div>
      <div class="segs">
        <div class="seg ${!d.dry?"on":""}" style="${!d.dry?"background:var(--blue)":""}" data-act="reefer" data-r="on">Reefer on</div>
        <div class="seg ${d.dry?"on":""}" style="${d.dry?"background:var(--mid)":""}" data-act="reefer" data-r="dry">Dry (reefer off)</div>
      </div>
    </div>`;
}
function tempFieldHtml(d){
  if(d.dry){
    return `<div class="muted" style="margin:0 2px 14px">Dry load — reefer off, no temperature recorded.</div>`;
  }
  const keys=["1","2","3","4","5","6","7","8","9","-","0","back"];
  const pad=keys.map(k=>`<button type="button" class="seg" data-act="tempkey" data-tempkey="${k}">${k==="-"?"−":k==="back"?"⌫":k}</button>`).join("");
  return `
    <div class="field">
      <div class="lbl">${tempLabel()}</div>
      <input id="temp" type="text" inputmode="none" autocomplete="off" readonly placeholder="e.g. -10" value="${esc(d.temp||"")}">
      <div id="tempPad" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px">
        ${pad}
      </div>
    </div>`;
}
function stopFieldsHtml(d) {

  const fuel = FUEL.map(f =>
    `<div
      class="seg ${d.fuel === f ? "on" : ""}"
      style="${d.fuel === f ? "background:var(--go)" : ""}"
      data-act="fuel"
      data-f="${f}">
      ${f}
    </div>`
  ).join("");


  return `

    <!-- EQUIPMENT TYPE -->
    <div class="field">

      <div class="lbl">Equipment</div>

      <div class="segs">

        <div
          class="seg ${d.bobtail ? "on" : ""}"
          style="${d.bobtail ? "background:var(--amber)" : ""}"
          data-act="bobtail">
          Bobtail
        </div>

        <div
          class="seg ${!d.bobtail && d.bobtail !== undefined ? "on" : ""}"
          style="${!d.bobtail && d.bobtail !== undefined ? "background:var(--blue)" : ""}"
          data-act="trailerMode">
          Trailer
        </div>

      </div>

    </div>


    ${
      d.bobtail
        ? ""
        : `

          <!-- TRAILER NUMBER -->
          <div class="field">

            <div class="lbl">Trailer</div>

            <input
                 id="trailer"
                 type="text"
                 inputmode="numeric"
                 pattern="[0-9]*"
                 placeholder="Trailer #"
                 value="${esc(d.trailer || "")}">
                

          </div>


          <!-- LOAD STATUS -->
          <div class="field">

            <div class="lbl">Load status</div>

            <div class="segs">

              <div
                class="seg ${d.status === "empty" ? "on" : ""}"
                style="${d.status === "empty" ? "background:var(--mid)" : ""}"
                data-act="status"
                data-s="empty">
                Empty
              </div>

              <div
                class="seg ${d.status === "load" ? "on" : ""}"
                style="${d.status === "load" ? "background:var(--blue)" : ""}"
                data-act="status"
                data-s="load">
                Loaded

            </div>

          </div>


          ${
            d.status === "load"
              ? `

                <!-- DRY / REEFER -->
                <div class="field">

                  <div class="lbl">Trailer type</div>

                  <div class="segs">

                    <div
                      class="seg ${d.dry ? "on" : ""}"
                      style="${d.dry ? "background:var(--mid)" : ""}"
                      data-act="reefer"
                      data-r="dry">
                      Dry
                    </div>

                    <div
                      class="seg ${!d.dry && d.dry !== undefined ? "on" : ""}"
                      style="${!d.dry && d.dry !== undefined ? "background:var(--blue)" : ""}"
                      data-act="reefer"
                      data-r="reefer">
                      Reefer
                    </div>

                  </div>

                </div>


                ${
                  !d.dry

/* =========================================================
SHIFT SCREEN
========================================================= */
function vShift() {
  const sh=S.shift;
  if(!sh)return `<div class="card muted">No active shift.</div>`;

  if(sh.done) return vSummary();

  const stops=sh.stops||[];
  const cur=stops.length?stops[stops.length-1]:null;

  const elapsed=`
    <div class="card" style="text-align:center">
      <div class="lbl">Shift elapsed</div>
      <div id="elapsed" class="mono" style="font-size:28px;font-weight:700;color:var(--amber)">
        ${hHM(diffH(sh.startTime,Date.now()))}
      </div>
    </div>`;

  const history=`
    <details class="mt">
      <summary style="cursor:pointer;padding:12px 2px;color:var(--muted)">
        Stops · ${stops.length}
      </summary>
      <div style="margin-top:8px">
        ${stops.length
          ? stops.map((s,i)=>stopRowHtml(s,i)).join("")
          : `<div class="card muted">No stops recorded.</div>`}
      </div>
    </details>`;

  /* -------------------------------------------------------
     DRIVING
     ------------------------------------------------------- */
  if(sh.phase==="driving"&&sh.next){
    const n=sh.next;
    const yard=n.pinned==="end";

    const dest=yard
      ? `
        <div class="card mt" style="border-color:var(--blue)">
          <div class="lbl">Driving to</div>
          <div style="font-weight:600;font-size:18px;margin-top:6px">
            <span class="badge" style="background:var(--stop)">YARD</span>

          </div>
        </div>`
      : `
        <div class="card mt" style="border-color:var(--blue)">
          <div class="lbl">Driving to</div>
          <div class="field mt" style="margin-bottom:8px">
            <input id="nextCompany"
              placeholder="Next stop company"
              value="${esc(n.company||"")}">
          </div>
          <div class="field" style="margin-bottom:0">
            <input id="nextCity"
              placeholder="City"
              value="${esc(n.city||"")}">
          </div>
        </div>`;

    return `
      ${elapsed}

      <div class="muted mt" style="margin-left:2px">
        On the road — arrive when you reach your destination.
      </div>

      ${dest}

      <button class="btn go mt" data-act="arrive">
        Arrive
      </button>

      ${history}
    `;
  }

  if(!cur)return `<div class="card muted">No current stop.</div>`;

  /* -------------------------------------------------------
     BACK AT YARD
     ------------------------------------------------------- */
if(cur.pinned==="end"){
  return `
    ${elapsed}

    <div class="card mt" style="border-color:var(--amber)">
      <div class="lbl">Final stop</div>

      <div style="font-size:18px;font-weight:600;margin-top:6px">
        ${esc(cur.company)||"Yard"}
      </div>

      ${
        cur.city
          ? `<div class="muted">${esc(cur.city)}</div>`
          : ""
      }

      <div class="muted mt">
        Add any final remarks, then end your shift.
      </div>
    </div>


    <div class="field">

      <div class="lbl">Remarks</div>

      <textarea
        id="remarks"
        placeholder="Final remarks…"
      >${esc(cur.remarks || "")}</textarea>

    </div>


    <button class="btn amber mt" data-act="endShift">
      End shift
    </button>


    ${history}
  `;
}

  /* -------------------------------------------------------
     AT A STOP — details + next stop on one screen; Depart saves
     ------------------------------------------------------- */
  if(true){
    return `
      ${elapsed}

      <div class="card mt" style="border-color:var(--blue);position:relative">

  <div style="
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px">

    <div>
      <div class="lbl">Current stop</div>

      <div style="
        font-size:18px;
        font-weight:600;
        margin-top:5px">
        ${esc(cur.company)||"Unnamed stop"}
      </div>

      ${cur.city
        ? `<div class="muted">${esc(cur.city)}</div>`
        : ""}
    </div>

    <div style="
      text-align:right;
      flex-shrink:0">

      <div class="lbl">At stop</div>

      <div
        id="stopTimer"
        class="mono"
        style="
          font-size:15px;
          font-weight:500;
          color:var(--amber);
          margin-top:3px">
        00:00:00
      </div>

    </div>

  </div>

  <div class="muted mt" style="font-size:12px">
    Complete the stop details below.
  </div>

</div>
      <div style="height:10px"></div>
      ${stopFieldsHtml(cur)}
      <div class="muted mt"
     style="
       text-align:center;
       font-size:12px;
       cursor:pointer"
       data-act="changeTruck">
       Change truck
</div>

      <div class="card mt" style="border-color:var(--blue)">
        <div class="lbl">Next stop</div>
        <div class="muted mt" style="font-size:13px">
          Where are you going next?
        </div>
        <div class="field mt">
          <input id="nextCompany" placeholder="Company" value="${esc(sh.next?.company||"")}">
        </div>
        <div class="field">
          <input id="nextCity" placeholder="City" value="${esc(sh.next?.city||"")}">
        </div>
      </div>

      <button class="btn stopb mt" data-act="depart">
        Depart
      </button>

      <button class="btn dark mt" data-act="returnToYard">
        Return to yard &amp; end
      </button>

      <button class="btn amber mt" data-act="makeFinal">
      Finish shift at this stop

      ${history}

  /* -------------------------------------------------------

      <div class="lbl">Next stop</div>

          id="nextCity"

    </div>

    <button class="btn stopb mt" data-act="depart">
      Depart
    </button>

    <button class="btn dark mt" data-act="stopBack">
      Back to stop details
    </button>

    <button class="btn dark mt" data-act="returnToYard">
      Return to yard &amp; end
    </button>

    ${history}
  `;
}

/* =========================================================
   WEEK VIEW
========================================================= */
function vWeek() {

  const all = S.past;

  const mon = mondayOf(new Date());
  const to = new Date(mon);

  to.setDate(mon.getDate() + 6);

  const days = [
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Saturday",
    "Sunday"
  ];


  let wk = 0;
  let worked = 0;

  const rows = [];


  for(let i = 0; i < 7; i++) {

    const d = new Date(mon);

    d.setDate(mon.getDate() + i);

    const sh =
      all.find(
        s => s.date === todayStr(d)
      );

    const h =
      sh
        ? diffH(
            sh.startTime,
            sh.finishTime
          )
        : 0;

    if(sh) worked++;

    wk += h;


    rows.push(`
      <div
        class="row"
        style="padding:6px 0">

        <span class="k">
          ${days[i]}
        </span>

        <span
          class="v mono"
          style="font-size:13px">

          ${
            sh
              ? fmtT(sh.startTime)
              : "--:--"
          }

          →

          ${
            sh
              ? fmtT(sh.finishTime)
              : "--:--"
          }

          ${
            h
              ? " · " + hDec(h) + " h"
              : ""
          }

        </span>

      </div>
    `);
  }


  return `
    <div style="
      display:flex;
      gap:12px;
      margin-top:8px">

      <div class="stat">

        <div class="lbl">
          Hours
        </div>

        <div
          class="n mono"
          style="
            color:var(--amber);
            font-size:20px">

          ${hDec(wk) || "0.00"}

        </div>

      </div>


      <div class="stat">

        <div class="lbl">
          Days
        </div>

        <div
          class="n"
          style="font-size:20px">

          ${worked}

        </div>

      </div>


      <div class="stat">

        <div class="lbl">
          Avg / day
        </div>

        <div
          class="n mono"
          style="font-size:20px">

          ${
            worked
              ? hDec(wk / worked)
              : "0.00"
          }

        </div>

      </div>

    </div>


    <div
      class="muted"
      style="
        margin-top:6px;
        font-size:12px">

/* =========================================================
   SAVED SHEETS
========================================================= */
function vSheets() {

  const dayList =
    S.past
      .map((s, i) => ({s, i}))
      .filter(e => e.s.done)
      .sort(
        (a,b) =>
          (b.s.startTime || 0) -
          (a.s.startTime || 0)
      );


  const dayRows =
    dayList.length
      ? dayList.map(({s, i}) => {

          const h =
            diffH(
              s.startTime,
              s.finishTime
            );

          const km =
            s.finishKm && s.startKm
              ? Number(s.finishKm) -
                Number(s.startKm)
              : "";

          const wd =
            WD[
              parseDate(s.date).getDay()
            ];


          return `
            <button
              class="stoprow"
              data-act="pdfDay"
              data-i="${i}">

              <div style="flex:1">

                <div style="font-weight:600">
                  ${s.date} · ${wd}
                </div>

                <div class="sub mono">
                  ${hDec(h) || "0.00"} h

                  ${
                    km !== ""
                      ? " · " + km + " km"
                      : ""
                  }

                  ·
                  ${(s.stops || []).length}
                  stops
                </div>

              </div>

              <div
                style="
                  color:var(--blue);
                  font-size:13px;
                  white-space:nowrap">

                PDF ›

              </div>

            </button>
          `;
        }).join("")
      : `
        <div class="card muted">
          No saved run sheets yet.
          Finish a shift and it'll appear here.
        </div>
      `;


  const weekMap = {};


  S.past
    .filter(s => s.done)
    .forEach(s => {

      const m =
        todayStr(
          mondayOf(
            parseDate(s.date)
          )
        );

      (weekMap[m] =
        weekMap[m] || []
      ).push(s);

    });


  const weekKeys =
    Object.keys(weekMap)
      .sort()
      .reverse();


  const weekRows =
    weekKeys.length
      ? weekKeys.map(m => {

          const listw = weekMap[m];

          let tot = 0;

          listw.forEach(
            s => {
              tot += diffH(
                s.startTime,
                s.finishTime
              );
            }
          );


          return `
            <button
              class="stoprow"
              data-act="pdfWeekOf"
              data-mon="${m}">

              <div style="flex:1">

                <div style="font-weight:600">
                  Week of ${m}
                </div>

                <div class="sub mono">
                  ${hDec(tot) || "0.00"} h
                  ·
                  ${listw.length}
                  day${listw.length > 1 ? "s" : ""}
                </div>

              </div>

              <div
                style="
                  color:var(--blue);
                  font-size:13px;
                  white-space:nowrap">

                PDF ›

              </div>

            </button>
          `;

        }).join("")
      : `
        <div class="card muted">
          No weekly timesheets yet.
        </div>
      `;


  return `
    <div
      class="lbl"
      style="
        margin:4px 2px 10px">

      Daily run sheets

    </div>

    ${dayRows}


    <div
      class="lbl"
      style="
        margin:22px 2px 10px">

      Weekly timesheets

    </div>

    ${weekRows}


    <p class="note">

      Every finished day and week is saved on this phone.
      Tap any to regenerate its PDF — identical each time.

    </p>
  `;
}


/* =========================================================
   LIVE EDITING
========================================================= */
function activeStop() {

  if(S.view === "editStop") {
    return S.draft;
  }

  if(
    S.view === "shift" &&
    S.shift &&
    S.shift.phase === "atStop"
  ) {
    return S.shift.stops[
      S.shift.stops.length - 1
    ];
  }

  return null;
}


function syncLive() {

  const g = id =>
    document.getElementById(id);

  const o = activeStop();


  if(o) {

    if(
      g("trailer") &&
      !o.bobtail
    ) {
      o.trailer =
        g("trailer").value;
    }


    if(g("temp")) {

      o.temp =
        cleanTemp(
          g("temp").value
        );

    }


    if(g("company")) {
      o.company =
        g("company").value;
    }


    if(g("city")) {
      o.city =
        g("city").value;
    }


    if(g("remarks")) {
      o.remarks =
        g("remarks").value;
    }
  }


  if(
    S.shift &&
    S.shift.next &&
    (
      S.view === "shift"
    )
  ) {

    if(g("nextCompany")) {
      S.shift.next.company =
        g("nextCompany").value;
    }

    if(g("nextCity")) {
      S.shift.next.city =
        g("nextCity").value;
    }

  }
}


/* =========================================================
   ACTIONS
========================================================= */
document.addEventListener("click", e => {

  const t =
    e.target.closest("[data-act]");

  if(!t) return;

  const a = t.dataset.act;


  /* Navigation */
  if(a === "go") {

    go(t.dataset.v);

    return;
  }


  /* Tabs */
  if(a === "tab") {

    const tab = t.dataset.tab;

    if(
      S.view === "shift" ||
      S.view === "summary" ||
      S.view === "editStop"
    ) {
      syncLive();
    }


    if(tab === "shift") {

      go(S.shift && !S.shift.done ? "shift" : "home");

    } else {

      go(tab);

    }

    return;
  }


/* Temperature unit */
if(a === "tempUnit") {

  if(!S.profile) {
    S.profile = {
      name: "Driver",
      corp: "",
      homeBase: "",
      tempUnit: "C"
    };
  }

  /* Save current profile fields before re-rendering */
  const nameEl = document.getElementById("pn");
  const corpEl = document.getElementById("pc");
  const homeEl = document.getElementById("ph");

  if(nameEl) {
    S.profile.name =
      nameEl.value.trim() || "Driver";
  }

  if(corpEl) {
    S.profile.corp =
      corpEl.value.trim();
  }

  if(homeEl) {
    S.profile.homeBase =
      homeEl.value.trim();
  }

  /* Change only the temperature unit */
  S.profile.tempUnit =
    t.dataset.unit === "F"
      ? "F"
      : "C";

  persist();
  render();

  return;
}

  /* Save profile */
  if(a === "saveProfile") {

    S.profile = {

      name:
        document
          .getElementById("pn")
          .value
          .trim() || "Driver",

      corp:
        document
          .getElementById("pc")
          .value
          .trim(),

      homeBase:
        document
          .getElementById("ph")
          .value
          .trim(),

      tempUnit:
        S.profile?.tempUnit === "F"
          ? "F"
          : "C"
    };


    persist();

    go("home");

    return;
  }


  /* Start shift from home */
  if(a === "startShiftHome") {

    S.pendingStart = round15(Date.now());   // clock in on the FIRST tap

    S.view = "shiftStart";

    renderStartShift();

    return;
  }


  /* Start shift */
if(a === "startShift") {

  const truck =
    document
      .getElementById("truck")
      .value
      .trim();

  if(!truck) {
    toast("Enter today's truck #");
    return;
  }


  const startKm =
    document
      .getElementById("startKm")
      .value
      .trim();

  if(!startKm) {
    toast("Enter starting mileage");
    return;
  }


  if(!/^\d+(\.\d+)?$/.test(startKm)) {
    toast("Starting mileage must contain numbers only");
    return;
  }


  const company =
    document
      .getElementById("startCo")
      .value
      .trim();

  if(!company) {
    toast("Enter starting yard / company");
    return;
  }


  const city =
    document
      .getElementById("startCity")
      .value
      .trim();

  if(!city) {
    toast("Enter starting city");
    return;
  }


  const t =
    S.pendingStart ||
    round15(Date.now());

  S.pendingStart = null;


  S.shift = {

     id: t,

    date: todayStr(),

    truck,

    trucks: [
      {
        truck: truck,
        startKm: startKm,
        finishKm: ""
      }
    ],
    
    startCompany: company,

    startCity: city,

    startTime: t,

    finishTime: null,

    phase: "atStop",

    next: blankNext(),

    endCompany: company,

    stops: [

      {
        trailer: "",
        bobtail: false,
        status: null,
        fuel: "",
        temp: "",
        company,
        city,
        timeIn: t,
        timeOut: null,
        remarks: "",
        pinned: "start"
      }

    ],

    startKm,

    finishKm: "",

    done: false

  };


  persist();

  go("shift");

  return;
}

  /* Edit stop */
  if(a === "editStop") {

    if(!S.shift) return;
    if(S.shift.done){ toast("Shift finished — view only"); return; }

    S.editMode = "edit";

    S.editIdx =
      Number(t.dataset.i);

    S.draft = {
      ...S.shift.stops[
        S.editIdx
      ]
    };

    go("editStop");

    return;
  }


/* Bobtail */
if(a === "bobtail") {

  syncLive();

  const o = activeStop();

  if(o) {

    o.bobtail = true;

    o.trailer = "";
    o.status = null;
    o.dry = false;
    o.fuel = "";
    o.temp = "";

  }

  persist();
  render();

  return;
}

 /* Trailer */
if(a === "trailerMode") {

  syncLive();

  const o = activeStop();

  if(o) {

    o.bobtail = false;

    if(o.status === undefined) {
      o.status = null;
    }

  }

  persist();
  render();

  return;
} 


  /* Status */
if(a === "status") {

  syncLive();

  const o = activeStop();

  const s = t.dataset.s;

  if(o) {

    o.status = s;

    if(s === "empty") {

      o.dry = false;
      o.fuel = "";
      o.temp = "";

    }

    if(s === "load") {

      o.dry = undefined;
      o.fuel = "";
      o.temp = "";

    }

  }

  persist();
  render();

  return;
}


  /* Fuel */
  if(a === "fuel") {

    syncLive();

    const o = activeStop();

    if(o) {
      o.fuel = t.dataset.f;
    }

    render();

    return;
  }

/* Dry / Reefer */
if(a === "reefer") {

  syncLive();

  const o = activeStop();

  if(o) {

    if(t.dataset.r === "dry") {

      o.dry = true;
      o.fuel = "";
      o.temp = "";

    } else {

      o.dry = false;

    }

  }

  persist();
  render();

  return;
}
  /* Temperature keypad */
if(a === "tempkey") {

  const key = t.dataset.tempkey;
  const o = activeStop();

  if(!o) return;

  let v = String(o.temp || "");

  if(key === "back") {

    v = v.slice(0, -1);

  } else if(key === "-") {

    if(v.startsWith("-")) {
      v = v.slice(1);
    } else if(v) {
      v = "-" + v;
    } else {
      v = "-";
    }

  } else {

    if(v === "-" && key === "0") {
      v = "-0";
    } else if(v === "0") {
      v = key;
    } else {
      v += key;
    }

  }

  o.temp = v;

  const input = document.getElementById("temp");

  if(input) {
    input.value = v;
  }

  persist();

  return;
}


  /* Time stamp */
  if(a === "stamp") {

    syncLive();

    if(
      S.view === "editStop" &&
      S.draft
    ) {

      S.draft[
        t.dataset.w === "in"
          ? "timeIn"
          : "timeOut"
      ] = Date.now();

    }

    render();

    return;
  }


  /* Save edited stop */
  if(a === "saveStop") {

    syncLive();

    if(
      !S.shift ||
      S.editIdx == null ||
      !S.draft
    ) {
      return;
    }


    S.shift.stops[
      S.editIdx
    ] = {
      ...S.draft
    };


    if(
      S.draft.pinned === "end"
    ) {
      S.shift.endCompany =
        S.draft.company;
    }


    persist();

    go("shift");

    return;
  }

  
/* Stop workflow */
if(a==="stopNext"){
  syncLive();

  if(!S.shift) return;

  S.shift.uiStep=1;
  persist();
  render();

  return;
}

if(a==="stopBack"){
  syncLive();

  if(!S.shift) return;

  S.shift.uiStep=0;
  persist();
  render();

  return;
}

  /* Finish shift at current stop */
if(a === "makeFinal") {

  syncLive();

  if(
    !S.shift ||
    !S.shift.stops ||
    !S.shift.stops.length
  ) {
    return;
  }

  const cur =
    S.shift.stops[
      S.shift.stops.length - 1
    ];

  /*
    The current stop is already the
    driver's final location.
    Do NOT create another yard stop.
  */

  const ok = confirm(
    "Finish shift at this stop?\n\n" +
    "This will make the current stop your final stop for today."
  );

  if(!ok) return;

  /*
    Mark the current stop as the final stop.
  */
  cur.pinned = "end";

  /*
    Save its company as the final company.
  */
  S.shift.endCompany =
    cur.company || "";

  /*
    Make sure the driver remains at this
    stop rather than entering the driving phase.
  */
  S.shift.phase = "atStop";

  persist();

  render();

  return;
}
  /* Depart */
if(a === "depart") {

  syncLive();

  if(!S.shift || !S.shift.stops.length) {
    return;
  }


  const cur =
    S.shift.stops[
      S.shift.stops.length - 1
    ];


  /* Equipment */

  if(
    !cur.bobtail &&
    !(cur.trailer || "").trim()
  ) {
    toast("Enter trailer # or select Bobtail");
    return;
  }


  /* Trailer workflow */

  if(!cur.bobtail) {

    /* Load status required */

    if(
      cur.status !== "empty" &&
      cur.status !== "load"
    ) {
      toast("Select Empty or Loaded");
      return;
    }


    /* Loaded workflow */

    if(cur.status === "load") {

      /* Dry or Reefer required */

      if(cur.dry !== true && cur.dry !== false) {
        toast("Select Dry or Reefer");
        return;
      }


      /* Reefer requires fuel + temperature */

      if(cur.dry === false) {

        if(
          !cur.fuel ||
          !String(cur.fuel).trim()
        ) {
          toast("Select a fuel level");
          return;
        }


        if(
          !String(cur.temp || "").trim()
        ) {
          toast("Enter temperature");
          return;
        }

      }

    }

  }


  /* Next destination */

  if(
    !S.shift.next ||
    !(S.shift.next.company || "").trim()
  ) {
    toast("Enter your next stop company");
    return;
  }


  if(
    !(S.shift.next.city || "").trim()
  ) {
    toast("Enter your next stop city");
    return;
  }


  /* Everything is complete */

  S.shift.stops[
    S.shift.stops.length - 1
  ].timeOut = Date.now();


  S.shift.phase = "driving";

  persist();

  go("shift");

  return;
}

  /* Return to yard */
if(a === "returnToYard") {

  syncLive();

  if(!S.shift || !S.shift.stops.length) {
    return;
  }


  const cur =
    S.shift.stops[
      S.shift.stops.length - 1
    ];


  /* Equipment */

  if(
    !cur.bobtail &&
    !(cur.trailer || "").trim()
  ) {
    toast("Enter trailer # or select Bobtail");
    return;
  }


  /* Trailer workflow */

  if(!cur.bobtail) {

    /* Load status required */

    if(
      cur.status !== "empty" &&
      cur.status !== "load"
    ) {
      toast("Select Empty or Loaded");
      return;
    }


    /* Loaded workflow */

    if(cur.status === "load") {

      /* Dry or Reefer required */

      if(cur.dry !== true && cur.dry !== false) {
        toast("Select Dry or Reefer");
        return;
      }


      /* Reefer requires fuel + temperature */

      if(cur.dry === false) {

        if(
          !cur.fuel ||
          !String(cur.fuel).trim()
        ) {
          toast("Select a fuel level");
          return;
        }


        if(
          !String(cur.temp || "").trim()
        ) {
          toast("Enter temperature");
          return;
        }

      }

    }

  }


  /* Everything required is complete */

  S.shift.next = {
    ...blankNext(),

    company:
      S.shift.endCompany ||
      S.profile.homeBase ||
      S.shift.startCompany ||
      "",

    pinned: "end"
  };


  S.shift.stops[
    S.shift.stops.length - 1
  ].timeOut = Date.now();


  S.shift.phase = "driving";

  persist();

  go("shift");

  return;
}

  /* Arrive */
  if(a === "arrive") {

    syncLive();

    const n = {
      ...S.shift.next
    };


    n.timeIn = Date.now();
    n.timeOut = null;
    n.stopTimerStart = n.timeIn;


    if(n.pinned === "end") {
      S.shift.endCompany =
        n.company;
    }


    S.shift.stops.push(n);

    S.shift.next =
      blankNext();

    S.shift.phase =
      "atStop";


    persist();

    go("shift");

    return;
  }


   /* End shift */
if(a === "endShift") {

  if(!S.shift || S.shift.done) return;

  syncLive();


  const ok = confirm(
    "End this shift?\n\n" +
    "Make sure you are back at the yard " +
    "and have completed this stop."
  );


  if(!ok) return;

  go("final");

  return;
}


  /* Finish shift */
  if(a === "finishShift") {

    const finishKm =
      document
        .getElementById("fkm")
        .value
        .trim();


    const startKm =
      String(
        S.shift.startKm || ""
      ).trim();


    if(!startKm) {
      toast(
        "Start mileage is missing from this shift"
      );
      return;
    }


    if(!finishKm) {
      toast("Enter finish mileage");
      return;
    }


    if(!/^\d+(\.\d+)?$/.test(finishKm)) {

      toast(
        "Mileage must contain numbers only"
      );

      return;
    }


    if(
      Number(finishKm) <
      Number(startKm)
    ) {

      toast(
        "Finish mileage cannot be lower than start mileage"
      );

      return;
    }


    S.shift.finishKm =
      finishKm;


    const actualFinish =
      Date.now();

    const t =
      round15(actualFinish);


    S.shift.stops[
      S.shift.stops.length - 1
    ].timeOut =
      actualFinish;


    S.shift.finishTime =
      t;

    S.shift.done =
      true;


    upsertPast(S.shift);

    persist();

    go("sheet");

    return;
  }


  /* Abandon active shift */
  if(a === "fileShift") {

    S.shift = null;

    persist();

    go("home");

    return;
  }


  /* Master reset */
  if(a === "masterReset") {

    const ok = confirm(
      "MASTER RESET\n\n" +
      "This will permanently delete:\n" +
      "• Your profile\n" +
      "• All saved shifts\n" +
      "• All run sheets\n" +
      "• All weekly timesheets\n" +
      "• The current shift\n\n" +
      "This cannot be undone.\n\n" +
      "Continue?"
    );


    if(!ok) return;


    try {
      localStorage.removeItem("ubt");
    } catch(e) {}


    S = {

      profile: null,

      past: [],

      shift: null,

      view: "setup",

      editMode: "edit",

      editIdx: null,

      draft: null

    };


    render();

    toast(
      "All data has been reset"
    );

    return;
  }


  /* PDFs */
  if(a === "pdfRun") {
    makeRunSheet(S.shift);
    return;
  }


  if(a === "pdfWeek") {
    makeWeekly();
    return;
  }


  if(a === "pdfDay") {

    const day =
      S.past[
        Number(t.dataset.i)
      ];

    makeRunSheet(day);

    return;
  }


  if(a === "pdfWeekOf") {

    makeWeekly(
      parseDate(t.dataset.mon)
    );

    return;
  }


  if(a === "print") {

    if(S.view === "sheet") {
      makeRunSheet(S.shift);
    } else {
      makeWeekly();
    }

    return;
  }

});

   INPUT HANDLING
========================================================= */
app.addEventListener("input", e => {

  if(
    S.view === "editStop" ||
    S.view === "shift"
  ) {
    syncLive();
  }


  /*
     Temperature field:
     keep minus sign and decimal point.
  */
  if(e.target.id === "temp") {

    const cleaned =
      cleanTemp(
        e.target.value
      );

    if(e.target.value !== cleaned) {

      const pos =
        e.target.selectionStart;

      e.target.value = cleaned;

      try {
        e.target.setSelectionRange(
          pos,
          pos
        );
      } catch(err) {}
    }


    const o = activeStop();

    if(o) {
      o.temp = cleaned;
    }
  }

});


/* =========================================================
   LIVE ELAPSED CLOCK

setInterval(() => {

  if(
    S.view === "shift" &&
    S.shift &&
    !S.shift.done
  ) {

    const el =
      document.getElementById("elapsed");

    if(el) {

      el.textContent =
        hHM(
          diffH(
            S.shift.startTime,
            Date.now()
          )
        );

    }


    /* Stop timer */

    if(
      S.shift.phase === "atStop"
    ) {

      const timer =
        document.getElementById("stopTimer");

      const stops =
        S.shift.stops || [];

      const cur =
        stops.length
          ? stops[stops.length - 1]
          : null;

      if(
        timer &&
        cur &&
        cur.stopTimerStart
      ) {

        const seconds =
          Math.max(
            0,
            Math.floor(
              (Date.now() -
                cur.stopTimerStart) / 1000
            )
          );

        const h =
          String(
            Math.floor(
              seconds / 3600
            )
          ).padStart(2, "0");

        const m =
          String(
            Math.floor(
              (seconds % 3600) / 60
            )
          ).padStart(2, "0");

        const s =
          String(
            seconds % 60
          ).padStart(2, "0");

        timer.textContent =
          `${h}:${m}:${s}`;
      }

    }

  }


  if(S.view === "home") {

    const c =
      document.getElementById("nowClock");

    if(c)
      c.textContent =
        fmtT(Date.now());

  }

}, 1000);
/* =========================================================
   PDF SHARING / DOWNLOAD
========================================================= */
async function sharePdf(bytes, filename) {

  const blob =
    new Blob(
      [bytes],
      {type: "application/pdf"}
    );


  try {

    const file =
      new File(
        [blob],
        filename,
        {type: "application/pdf"}
      );


    if(
      navigator.canShare &&
      navigator.canShare({
        files: [file]
      })
    ) {

      await navigator.share({
        files: [file],
        title: filename
      });

      return;
    }

  } catch(e) {}


  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download = filename;

  document.body.appendChild(a);

  a.click();

  a.remove();


  setTimeout(
    () => URL.revokeObjectURL(url),
    4000
  );


  toast("PDF saved");
}


/* =========================================================
   DAILY RUN SHEET PDF
========================================================= */
async function makeRunSheet(shift) {

  if(!PDFLib) {
    toast(
      "PDF library still loading…"
    );
    return;
  }


  const {
    PDFDocument,
    StandardFonts,
    rgb
  } = PDFLib;


  const doc =
    await PDFDocument.create();


  const F =
    await doc.embedFont(
      StandardFonts.Helvetica
    );

  const B =
    await doc.embedFont(
      StandardFonts.HelveticaBold
    );


  const sh =
    shift || S.shift;

  const pr =
    S.profile;


  const total =
    hDec(
      diffH(
        sh.startTime,
        sh.finishTime
      )
    );


  const stops =
    sh.stops || [];


  const pages =
    Math.max(
      1,
      Math.ceil(
        stops.length / 10
      )
    );


  for(
    let p = 0;
    p < pages;
    p++
  ) {

    const rows =
      stops.slice(
        p * 10,
        p * 10 + 10
      );


    drawRunPage(
      doc,
      F,
      B,
      rgb,
      sh,
      pr,
      rows,
      total,
      p + 1,
      pages
    );

  }


  const bytes =
    await doc.save();


  await sharePdf(
    bytes,
    `UBT_RunSheet_${sh.date}.pdf`
  );
}
