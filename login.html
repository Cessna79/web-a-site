<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Private Projects</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #1f2937,
          #09090b 65%
        );

      color: #fff;
    }

    .login {
      width: calc(100% - 40px);
      max-width: 380px;

      padding: 38px 32px;

      background:
        rgba(255,255,255,.06);

      border:
        1px solid rgba(255,255,255,.10);

      border-radius: 24px;

      backdrop-filter: blur(20px);

      box-shadow:
        0 30px 80px rgba(0,0,0,.40);

      text-align: center;
    }

    .lock {
      width: 58px;
      height: 58px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin:
        0 auto
        22px;

      border-radius: 16px;

      background:
        rgba(255,255,255,.08);

      font-size: 26px;
    }

    h1 {
      margin: 0 0 8px;

      font-size: 25px;
      font-weight: 650;

      letter-spacing:
        -.5px;
    }

    .subtitle {
      margin-bottom: 28px;

      color:
        rgba(255,255,255,.55);

      font-size: 14px;
    }

    input {
      width: 100%;

      padding:
        15px 16px;

      border:
        1px solid
        rgba(255,255,255,.12);

      border-radius: 12px;

      background:
        rgba(255,255,255,.07);

      color: #fff;

      font-size: 16px;

      outline: none;
    }

    input:focus {
      border-color:
        #3b82f6;
    }

    input::placeholder {
      color:
        rgba(255,255,255,.35);
    }

    button {
      width: 100%;

      margin-top: 14px;

      padding:
        15px 16px;

      border: none;
      border-radius: 12px;

      background:
        #3b82f6;

      color: white;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;
    }

    button:hover {
      background:
        #2563eb;
    }

    button:disabled {
      opacity: .55;
      cursor: default;
    }

    #error {
      min-height: 22px;

      margin-top: 15px;

      color: #fb7185;

      font-size: 13px;
    }

  </style>

</head>

<body>

  <div class="login">

    <div class="lock">
      🔒
    </div>

    <h1>
      Private Projects
    </h1>

    <div class="subtitle">
      Enter your password to continue
    </div>

    <form id="loginForm">

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        autofocus
        required
      >

      <button
        id="submitButton"
        type="submit"
      >
        Unlock
      </button>

      <div id="error"></div>

    </form>

  </div>


<script>

const form =
  document.getElementById("loginForm");

const password =
  document.getElementById("password");

const button =
  document.getElementById("submitButton");

const error =
  document.getElementById("error");


form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    error.textContent = "";

    button.disabled = true;

    button.textContent =
      "Checking...";

    try {

      const response =
        await fetch(
          "/api/login",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                password:
                  password.value
              })
          }
        );

      const data =
        await response.json();

      if (!response.ok) {

        error.textContent =
          data.message ||
          "Incorrect password";

        password.value = "";

        password.focus();

        return;
      }


      const params =
        new URLSearchParams(
          window.location.search
        );

      const next =
        params.get("next") || "/";


      window.location.href =
        next;

    }

    catch (err) {

      error.textContent =
        "Unable to sign in.";

    }

    finally {

      button.disabled = false;

      button.textContent =
        "Unlock";

    }

  }
);

</script>

</body>
</html>
